<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="test">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LSS Wachenplaner – Testansicht</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>body{margin:0;min-height:100vh;background:#f4f4f4;font-family:system-ui} .mock-navbar{height:50px;background:#cf2f2c}.mock-navbar ul{display:flex;justify-content:flex-end;height:50px;margin:0;padding:0 30px;list-style:none}.mock-navbar li{height:50px}.mock-navbar a{display:flex;height:50px;align-items:center;padding:0 14px;color:#fff;text-decoration:none}.mock-navbar .dropdown-menu{display:none}.mock{padding:40px;color:#333}</style>
</head>
<body>
  <!-- Testseite: lädt dist/lss-wachenplaner.user.js mit nachgebildeten Spiel-Endpunkten. Über einen lokalen Webserver öffnen. -->
  <nav class="navbar mock-navbar"><ul class="navbar-nav navbar-right"><li class="dropdown"><a href="#" title="Community">▤</a><ul class="dropdown-menu"><li><a href="/forum">Forum</a></li></ul></li><li><a href="/credits">Credits</a></li></ul></nav>
  <div class="mock"><h2>Leitstellenspiel – lokale Testseite</h2><p>Oben in der Leiste den Wachenplaner (Stecknadel) öffnen.</p></div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const buildings = [
      { id: 20, caption: "Feuerwache Innenstadt", building_type: 0, leitstelle_building_id: 30, latitude: 48.2082, longitude: 16.3738 },
      { id: 21, caption: "Rettungswache Nord", building_type: 2, leitstelle_building_id: 30, latitude: 48.238, longitude: 16.38 },
      { id: 30, caption: "Leitstelle Wien", building_type: 7, latitude: 48.214, longitude: 16.36 },
    ];
    // Belastungstest: ?big=900 ergänzt 900 zufällig verteilte eigene Wachen in Österreich.
    const bigCount = Number(new URLSearchParams(location.search).get("big")) || 0;
    let seed = 7;
    const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let index = 0; index < bigCount; index += 1) {
      buildings.push({ id: 1000 + index, caption: `Eigene Wache ${index + 1}`, building_type: index % 4 === 0 ? 2 : 0, leitstelle_building_id: 30, latitude: 46.6 + random() * 2.2, longitude: 9.8 + random() * 7 });
    }
    window.fetch = async (input, options = {}) => {
      const url = new URL(typeof input === "string" ? input : input.url, location.origin);
      const method = String(options.method || "GET").toUpperCase();
      if (url.pathname === "/api/buildings") {
        return new Response(JSON.stringify(buildings), { status: 200, headers: { "Content-Type": "application/json" } });
      }
      if (url.pathname === "/buildings/new") {
        return new Response(`<form id="new_building" action="/buildings" method="post"><input name="authenticity_token" value="test">
          <label for="building_building_type">Typ</label><select id="building_building_type" name="building[building_type]"><option value="0">Feuerwache</option><option value="18">Feuerwache (Kleinwache)</option><option value="2">Rettungswache</option><option value="7">Leitstelle</option></select>
          <input id="building_name" name="building[name]" maxlength="40" value="">
          <select id="building_leitstelle_building_id" name="building[leitstelle_building_id]"><option value="">Keine</option><option value="30">Leitstelle Wien</option></select>
          <label for="building_start_vehicle">Startfahrzeug</label><select id="building_start_vehicle" name="building[start_vehicle_feuerwache]"><option value="30">HLF 20</option><option value="0">LF 20</option></select>
          <input type="hidden" name="building[latitude]" value=""><input type="hidden" name="building[longitude]" value=""><input type="hidden" name="building[address]" value="">
          <input type="submit" name="build_with_coins" value="Mit Coins bauen"><input type="submit" name="build_with_credits" value="Mit Credits bauen"></form>`, { status: 200 });
      }
      if (url.pathname === "/buildings" && method === "POST") {
        const body = new URLSearchParams(String(options.body));
        if (!body.has("build_with_credits") || body.has("build_with_coins")) return new Response('<div class="alert alert-danger">Falscher Bau-Knopf</div>', { status: 200 });
        window.lastBuildRequest = Object.fromEntries(body);
        buildings.push({ id: 40 + buildings.length, caption: body.get("building[name]"), building_type: Number(body.get("building[building_type]")), leitstelle_building_id: Number(body.get("building[leitstelle_building_id]")) || null, latitude: Number(body.get("building[latitude]")), longitude: Number(body.get("building[longitude]")) });
        return new Response("ok", { status: 200 });
      }
      return new Response("Nicht gefunden", { status: 404 });
    };
  </script>
  <script src="../dist/lss-wachenplaner.user.js"></script>
</body>
</html>
